<!DOCTYPE html><html lang="mn"><head><meta charset="utf-8"><title>Кинематик бодлогын дэвтэр</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667;--ac:#2563eb;--ok:#16a34a;--wip:#d97706;--bd:#dde1e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232b;--tx:#e8ebf0;--mu:#97a0ad;--ac:#6ea0ff;--ok:#4ade80;--wip:#fbbf24;--bd:#333a45}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e232b;--tx:#e8ebf0;--mu:#97a0ad;--ac:#6ea0ff;--ok:#4ade80;--wip:#fbbf24;--bd:#333a45}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:12px 0}
.grid button{padding:8px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font-size:14px}
.grid button.wip{border-color:var(--wip);background:color-mix(in srgb,var(--wip) 18%,var(--card))}
.grid button.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.grid button.cur{outline:2px solid var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.c h2{font-size:15px;margin:0 0 8px}
.f{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0}
.f b{font-size:13px}.f pre{margin:4px 0 0;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-x:auto}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:200px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
.sy button,.nav button,.btn{padding:6px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit;flex:0 0 auto}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.sy{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.ans{display:none;color:var(--ok);font-weight:600;margin-top:8px}
#sv{color:var(--ok);font-size:13px;min-height:18px}
</style></head><body><div class="w">
<h1>⚙️ Кинематик бодлогын дэвтэр <span class="mu">(зөвхөн унших)</span></h1>
<div class="mu">40 бодлого · g = 10 м/с² · Сурагчийн бодолтыг харах хувилбар</div>

<div class="grid" id="gr"></div>
<div class="c"><h2 id="ph"></h2><div id="pq"></div></div>
<div class="c"><h2>📐 Хэрэгтэй томьёо</h2><div id="fm"></div>
<details><summary class="mu" style="cursor:pointer">Бүх томьёо харах</summary><div id="af"></div></details></div>
<div class="c"><h2>✍️ Сурагчийн бодолт</h2><pre id="wk" style="white-space:pre-wrap;font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:0"></pre><p><b>Сурагчийн хариу:</b> <span id="an"></span></p><div id="stt"></div><div class="row"><button class="btn" id="rv">Лавлах хариу харах</button></div><div class="ans" id="ra"></div></div>
<div class="row nav"><button id="pv">← Өмнөх</button><button id="nx" class="btn p">Дараах →</button></div>
</div><script>
const P={"1": "Тайван байснаас 2 м/с² тогтмол хурдатгалтайгаар 5 с хөдөлсөн биеийн эцсийн хурд ба туулсан замыг ол.", "2": "10 м/с анхны хурдтай бие 3 м/с² хурдатгалтайгаар 4 с хөдөлжээ. Биеийн эцсийн хурд ба туулсан замыг ол.", "3": "20 м/с хурдтай явж байсан автомашин тоормослоод 2 м/с² тогтмол удаашралтайгаар зогсов. Зогсох хүртэлх хугацаа ба туулсан замыг ол.", "4": "Бие тайван байдлаас эхлэн тогтмол хурдатгалтай хөдөлж 100 м замыг 10 с-д туулсан бол хурдатгалыг ол.", "5": "Бие 45 м өндрөөс чөлөөтэй унав. Унах хугацаа болон газарт тусах агшин дахь хурдыг ол.", "6": "Чөлөөт уналт хийж байгаа бие унаж эхэлснээс хойш 3 с-ийн дараа ямар хурдтай болох ба ямар өндөр туулсан бэ?", "7": "Биеийг 30 м/с анхны хурдтайгаар эгц дээш шидэв. Биеийн хөөрөх хамгийн дээд өндөр ба дээш хөөрөх хугацааг ол.", "8": "Эгц дээш 20 м/с хурдтай шидэгдсэн бие анхны цэгтээ эргэн ирэх хүртэлх нийт хугацаа болон туулсан нийт замыг ол.", "9": "Эгц дээш 40 м/с хурдтай шидэгдсэн бие шидэгдсэнээс хойш 2 с-ийн дараа ямар өндөрт байх вэ?", "10": "20 м өндөр цамхгаас хэвтээ чиглэлд 15 м/с хурдтайгаар биеийг шидэв. Биеийн газарт унах хугацааг ол.", "11": "Хэвтээ чиглэлд 10 м/с хурдтай шидэгдсэн бие 80 м өндрөөс унасан бол цамхгийн сууриас ямар зайд тусах вэ?", "12": "Биеийг хэвтээ чиглэлд 20 м/с хурдтайгаар 45 м өндрөөс шидэв. Газарт тусах агшин дахь нийт хурдыг ол.", "13": "Хэвтээд α = 30° өнцөг үүсгэн 20 м/с анхны хурдтай шидэгдсэн биеийн хөөрөх хамгийн дээд өндрийг ол.", "14": "Хэвтээд α = 45° өнцөг үүсгэн 10√2 м/с анхны хурдтай шидэгдсэн биеийн нисэх холчийг (тусгалын зай) ол.", "15": "Тогтмол хурдатгалтай хөдөлж буй биеийн хурд 16 м зайд 2 м/с-ээс 6 м/с болж өссөн бол биеийн хурдатгал ба хөдөлсөн хугацааг ол.", "16": "Тайван байснаас тогтмол хурдатгалтай хөдөлж буй бие хөдөлгөөнийхөө 4 дэх секундэд 14 м зам туулсан бол хурдатгалыг ол.", "17": "Чөлөөт унаж буй бие хөдөлгөөнийхөө сүүлийн 1 с-д 25 м зам туулсан бол уг бие ямар өндрөөс унасан бэ?", "18": "Эгц дээш шидэгдсэн бие хөөрөх замдаа 15 м өндрийг хоёр удаа 2 с-ийн зайтайгаар дайран өнгөрсөн бол биеийн анхны хурдыг ол.", "19": "50 м өндөртэй цамхгийн оройгоос биеийг 10 м/с хурдтайгаар эгц дээш шидэв. Бие газраас хамгийн дээд тал нь ямар өндөрт хөөрөх ба хэдэн секундийн дараа газарт унах вэ?", "20": "80 м өндөр хясаан дээрээс хэвтээ чиглэлд шидэгдсэн бие хясааны сууриас 60 м зайд унасан бол анхны хурдыг ол.", "21": "Хэвтээ чиглэлд шидэгдсэн биеийн хурдны чиглэл 2 с-ийн дараа хэвтээтэй 45° өнцөг үүсгэсэн бол биеийн анхны хурдыг ол.", "22": "Хэвтээд α = 30° өнцөг үүсгэн шидэгдсэн бие 4 с-ийн дараа газарт унав. Биеийн анхны хурд ба нисэх холчийг ол.", "23": "Хэвтээд өнцөг үүсгэн шидэгдсэн биеийн хамгийн дээд өндөр h_max ба нисэх холч L хоёр тэнцүү байх шидэх өнцөг α-г ол.", "24": "Тайван байснаас тогтмол хурдатгалтай хөдөлсөн бие эхний 3 с-д 18 м зам туулжээ. Хөдөлгөөний дараалсан ижил хугацааны замын харьцааг ашиглан биеийн зөвхөн 3 дахь секундэд туулсан замыг ол.", "25": "Нэг шулууны дагуу 20 м/с ба 10 м/с хурдтайгаар бие биеэ чиглэн явж байсан хоёр автомашин бие биеэсээ 150 м зайд байхдаа хоёулаа 2 м/с² удаашралтайгаар тоормослож эхлэв. Тэд мөргөлдөх үү? Хоорондох хамгийн бага зайг ол.", "26": "H = 60 м өндөртэй байшингийн оройгоос нэг биеийг чөлөөтэй унагахад яг тэр агшинд газартай нэг босоо шулуун дээр байх цэгээс нөгөө биеийг v₀ = 30 м/с анхны хурдтайгаар эгц дээш шидэв. Биес агаарт хэдэн секундийн дараа ба газраас ямар өндөрт уулзах вэ?", "27": "Цамхгийн оройгоос нэг биеийг чөлөөтэй унагаснаас 1 с-ийн дараа өөр нэг биеийг 20 м/с анхны хурдтайгаар араас нь эгц доош шидэв. Хоёр дахь бие эхний биеийг унаж эхэлснээс хойш хэдэн секундийн дараа ба ямар зайд гүйцэх вэ?", "28": "h = 45 м өндөр хясаанаас v₀ = 15 м/с хурдтайгаар хэвтээ чиглэлд шидэгдсэн биеийн газарт тусах агшин дахь хурдны вектор хэвтээтэй үүсгэх өнцөг θ-г ол.", "29": "Хэвтээд α = 60° өнцөг үүсгэн v₀ = 20 м/с хурдтай шидэгдсэн биеийн хурдны вектор хэвтээтэй 30° өнцөг үүсгэх агшин дахь өндөр ба хугацааг ол.", "30": "Биеийг хэвтээд өнцөг үүсгэн шидэхэд нисэх холч нь хамгийн дээд өндрөөсөө 4 дахин их байв. Шидэх өнцөг α-г ол.", "31": "Хэвтээтэй β = 30° өнцөг үүсгэсэн налуу хавтгайн оройгоос биеийг налуутай перпендикуляр чиглэлд v₀ = 10 м/с хурдтай шидэв. Бие налуу дээр буцаж унах хүртэлх хугацааг ол.", "32": "Хэвтээ гадарга дээр d = 20 м зайд орших хоёр цэгээс нэгэн ижил v₀ = 20 м/с анхны хурдтайгаар хоёр биеийг бие бие рүү нь хэвтээд ижил α өнцөг үүсгэн шидэхэд тэд агаарт хамгийн дээд өндөртөө мөргөлдөв. Шидэх өнцөг α-г ол.", "33": "H = 20 м өндөртэй цамхгийн оройгоос хэвтээ чиглэлд шидсэн бие ба цамхгийн сууриас хэвтээтэй α = 45° өнцөг үүсгэн цамхаг руу чиглүүлэн нэгэн агшинд шидсэн биес агаарт мөргөлдөв. Анхны хурдууд нь v₁ = 10 м/с ба v₂ = 20 м/с байсан бол тэд шидэгдсэнээс хойш ямар хугацааны дараа мөргөлдөх вэ?", "34": "Эгц дээш шидэгдсэн бие буцаж унахдаа траекторынхоо дээд хэсгийн h/2 өндрийг t₁ хугацаанд, доод хэсгийн h/2 өндрийг t₂ хугацаанд туулсан бол t₁ / t₂ харьцааг ол.", "35": "Хэвтээ зайд L = 40 м, өндөрт h = 10 м байрлах байг онохын тулд биеийг хэвтээд өнцөг үүсгэн v₀ = 20√2 м/с хурдтайгаар шидэх хэрэгтэй. Боломжит шидэх өнцөг α-г ол.", "36": "Бие тайван байснаас эхлэн a₁ хурдатгалтайгаар хөдөлж, дараа нь шууд a₂ удаашралтайгаар хөдөлж зогсов. Нийт туулсан зам S ба нийт хөдөлсөн хугацаа T бол биеийн хөдөлгөөний хамгийн их хурд v_max-ыг S ба T-гээр илэрхийл.", "37": "Хэвтээд α өнцөг үүсгэн v₀ анхны хурдтай шидсэн биеийн траекторын хамгийн дээд цэг дээрх муруйлтын радиус R-ийг v₀, α, g-ээр илэрхийлэн ол.", "38": "H = 5 м өндөртэй таазтай зааланд хэвтээд өнцөг үүсгэн шидэх биеийн тусах хамгийн их холч (шидэх хамгийн хол зай)-г ол. Биеийн анхны хурд v₀ = 20 м/с бөгөөд бие таазанд тулахгүй байх ёстой.", "39": "Эхний биеийг h өндрөөс чөлөөтэй унагав. Яг тэр агшинд түүнээс d хэвтээ зайд, газраас v₀ анхны хурдтайгаар 2 дахь биеийг шидэв. Хоёр бие агаарт мөргөлдөхийн тулд 2 дахь биеийг хэвтээтэй ямар өнцгөөр шидэх ёстой вэ? Мөргөлдөх хугацааг ол.", "40": "Хэвтээтэй β өнцөг үүсгэсэн налуу хавтгайн дагуу дээш налуутай α өнцөг үүсгэн v₀ анхны хурдтай шидсэн биеийн налуу хавтгай дээр тусах L замын формулыг гаргаж, L хамгийн их байх өнцөг α-г тодорхойл."},F={"A": ["Тогтмол хурдатгалтай хөдөлгөөн", "v = v₀ + a·t\ns = v₀·t + ½·a·t²\nv² = v₀² + 2·a·s\ns = (v₀+v)·t/2"], "N": ["n дэх секундийн зам", "sₙ = v₀ + a·(2n−1)/2   (v₀=0 бол sₙ = a(2n−1)/2)\nДараалсан ижил хугацаа: s₁:s₂:s₃ = 1:3:5"], "G": ["Чөлөөт уналт (v₀=0), g=10 м/с²", "v = g·t\nh = ½·g·t²\nv² = 2·g·h\nt = √(2h/g)"], "U": ["Эгц дээш шидэлт", "v = v₀ − g·t\nh = v₀·t − ½·g·t²\nh_max = v₀²/(2g)\nt_дээш = v₀/g,  T_нийт = 2v₀/g"], "H": ["Хэвтээ шидэлт", "x = v₀·t,   y = ½·g·t²\nt = √(2H/g),   L = v₀·t\nv_y = g·t,   v = √(v₀²+v_y²),   tg θ = v_y/v₀"], "O": ["Хазгай шидэлт (хэвтээтэй α өнцөг)", "vₓ = v₀cosα,   v_y = v₀sinα − g·t\nx = v₀cosα·t,   y = v₀sinα·t − ½g·t²\nh_max = v₀²sin²α/(2g)\nT = 2v₀sinα/g\nL = v₀²·sin2α/g"], "R": ["Уулзалт / гүйцэлт", "Хоёр биеийн координатыг бичиж x₁(t)=x₂(t), y₁(t)=y₂(t) гэж тэгшитгэнэ.\nХарьцангуй хөдөлгөөн: v_хар = v₁ − v₂"], "I": ["Налуу хавтгай", "Тэнхлэгийг налуугийн дагуу ба перпендикуляр сонгоно:\ng_∥ = g·sinβ,   g_⊥ = g·cosβ\nL = 2v₀²·sinα·cos(α+β)/(g·cos²β)"], "M": ["Квадрат язгуур ба алгебр", "√(a·b) = √a·√b,   √(a²) = a\n√2 ≈ 1,414;  √3 ≈ 1,732\nax²+bx+c=0:  D = b²−4ac,  x = (−b ± √D)/(2a)\nsin30°=1/2;  sin45°=√2/2;  sin60°=√3/2\nsin2α = 2sinα·cosα;  tgα = sinα/cosα"], "C": ["Муруйлтын радиус", "a_n = v²/R  ⇒  R = v²/a_n   (оройд a_n = g, v = v₀cosα)"]},H={"1": {"f": ["A"], "a": "v = 10 м/с;  s = 25 м"}, "2": {"f": ["A"], "a": "v = 22 м/с;  s = 64 м"}, "3": {"f": ["A"], "a": "t = 10 с;  s = 100 м"}, "4": {"f": ["A"], "a": "a = 2s/t² = 2 м/с²"}, "5": {"f": ["G"], "a": "t = 3 с;  v = 30 м/с"}, "6": {"f": ["G"], "a": "v = 30 м/с;  h = 45 м"}, "7": {"f": ["U"], "a": "h_max = 45 м;  t = 3 с"}, "8": {"f": ["U"], "a": "T = 4 с;  нийт зам = 40 м (шилжилт 0)"}, "9": {"f": ["U"], "a": "h = 60 м"}, "10": {"f": ["H"], "a": "t = 2 с"}, "11": {"f": ["H"], "a": "t = 4 с;  x = 40 м"},
